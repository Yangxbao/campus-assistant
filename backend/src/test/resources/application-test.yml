# 测试专用配置：H2 内存库（MySQL 兼容模式）替代 MySQL；Redis 不可用时业务自动降级
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:campus_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 300ms
